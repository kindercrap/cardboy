name: Monitor Yuyu-tei prices

on:
  schedule:
    # 01:15 UTC is 09:15 Philippine Time (PHT, UTC+8).
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      probe_only:
        description: Test an exact Yuyu-tei variant against the public daily price catalog
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cardboy-yuyutei-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Probe exact Yuyu-tei variant in the daily catalog
        if: ${{ inputs.probe_only == true }}
        run: node scripts/monitor-prices.mjs --probe https://yuyu-tei.jp/sell/opc/card/op05/10155
      - name: Check saved cards and create alerts
        if: ${{ inputs.probe_only != true }}
        env:
          SUPABASE_URL: ${{ secrets.CARDBOY_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.CARDBOY_SUPABASE_SECRET_KEY }}
        run: node scripts/monitor-prices.mjs
