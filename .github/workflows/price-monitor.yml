name: Monitor Yuyutei selling prices via Card-Value

on:
  schedule:
    # 01:15 UTC is 09:15 Philippine Time (PHT, UTC+8).
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      probe_only:
        description: Test the Yuyutei selling row on the Card-Value Shanks example
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cardboy-card-value-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Probe the exact Card-Value Yuyutei selling row
        if: ${{ inputs.probe_only == true }}
        run: node scripts/monitor-prices.mjs --probe https://card-value.jp/onepiece/cards/op17-022-3/
      - name: Check saved cards via Card-Value and create alerts
        if: ${{ inputs.probe_only != true }}
        env:
          SUPABASE_URL: ${{ secrets.CARDBOY_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.CARDBOY_SUPABASE_SECRET_KEY }}
        run: node scripts/monitor-prices.mjs
